# Local development with Docker.
#
#   docker compose up --build   -> http://localhost:8080
#
# Serves both apps from one origin, which is required: the dashboard embeds the
# editor and both read the same IndexedDB, and IndexedDB is partitioned per
# origin.

services:
  mosaic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: ghcr.io/dramatic4678565/mosaic:latest
    container_name: mosaic
    ports:
      # 8080 on the host, because the editor's own dev tooling defaults to 8080
      # elsewhere and 8080 is the port documented in the README.
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
