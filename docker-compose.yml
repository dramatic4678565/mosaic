# Local development with Docker.
#
#   docker compose up --build   -> http://localhost:8080
#
# Serves both apps from one origin, which is required: the dashboard embeds the
# editor and both read the same IndexedDB, and IndexedDB is partitioned per
# origin.

services:
  mosaic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: ghcr.io/dramatic4678565/mosaic:latest
    container_name: mosaic
    ports:
      # Host 8080 -> container 8080 (the unprivileged nginx default).
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
