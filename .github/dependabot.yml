version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Monthly, not weekly. Every dependency pull request costs a full CI run
      # (about 18 minutes now, 33 before this branch), and the free plan allows
      # 2,000 minutes a month. Sixteen pull requests arriving at once is what
      # exhausted it today, and closing the oversized groups only made Dependabot
      # regroup them into larger ones (25 and 33 updates) rather than stopping.
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
    # Majors are opt-in, not automatic.
    #
    # The first run of this config opened sixteen pull requests, ten of them major
    # bumps: vite 5 to 8, vitest 3 to 5, react-router-dom 6 to 7, @types/node 20 to
    # 26, @babel/preset-env 7 to 8, pako 2 to 3, and three GitHub Actions jumps
    # including upload-artifact 4 to 7. Each is a breaking change that needs a
    # person to read the changelog and a plan, not a weekly automated pull request.
    #
    # To take one deliberately, ask for it by hand with
    #   gh pr edit <n> --title ...
    # or delete the matching entry here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These five cannot move inside a grouped production-deps update.
      #
      # Dependabot keeps reopening a 25-update production group (#55, #83) and a
      # 33-update dev group (#56, #87) that both fail, and closing them just makes
      # the next monthly run rebuild the identical groups. The reasons are
      # recorded here so nobody has to rediscover them:
      #
      #   react, react-dom, jotai  jotai 2.20.3 resolves its own nested react
      #                             while react-dom uses the hoisted one, so two
      #                             React instances exist and every render dies
      #                             with "Cannot read properties of null
      #                             (reading 'useContext')" at useStore.
      #                             Pinning react and radix-ui back does not clear
      #                             it; jotai is the trigger.
      #
      #   radix-ui                 1.4.3 to 1.6.7 changes useId output from
      #                             "radix-:r85:" to "radix-_r_8k_", breaking 3
      #                             snapshot files for no behavioural change.
      #
      #   jotai-scope              tracks jotai; same nested-react problem.
      #
      # #72 took the security-relevant bumps from that group with react, jotai and
      # radix-ui left at their current versions, and it passed: 2505 editor tests,
      # 52 dashboard tests, and a clean editor build. These five need a deliberate
      # pull request with the snapshot updates reviewed rather than accepted.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "jotai"
      - dependency-name: "jotai-scope"
      - dependency-name: "radix-ui"
      # Not excluded from the dev-deps group instead: Dependabot raises these
      # three as standalone pull requests (#96 eslint-config-prettier, #97
      # prettier, #98 eslint-plugin-prettier), which a group's
      # exclude-patterns never covers. ignore is the only list that catches
      # both grouped and standalone updates.
      #
      # prettier 2.6.2 to 2.8.8 reformats 272 lines across the editor, all of
      # them `prettier/prettier` warnings and zero errors, and eslint runs with
      # --max-warnings=0 so the build stops on formatting alone.
      # Stats/index.tsx accounts for 181 of the 272 on its own.
      - dependency-name: "prettier"
      - dependency-name: "eslint-plugin-prettier"
      - dependency-name: "eslint-config-prettier"
    groups:
      production-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/mosaic-dashboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "dashboard"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The two directories below are not part of the root `workspaces` list, which is
  # why they were missed and why they carry most of this repository's alerts.
  #
  # Of 380 open Dependabot alerts, 189 are against dev-docs/yarn.lock and 43
  # against examples/with-nextjs/yarn.lock - 232 of them, in two lockfiles that
  # nothing was watching. They were not covered by any entry here, so their
  # transitive dependencies have simply aged: shell-quote and websocket-driver at
  # critical, axios 23 times at high, node-forge, brace-expansion, postcss, ws.
  #
  # Neither tree ships. dev-docs is a Docusaurus site, examples are sample apps.
  # That is a reason to rank them below the two that do ship, not a reason to leave
  # them unmanaged, because a compromised build tool is a compromised build.
  #
  # Monthly and limit 3 to keep the pull-request count down; these are the lowest
  # priority of the four ecosystems.
  - package-ecosystem: "npm"
    directory: "/dev-docs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "dev-docs"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/examples/with-nextjs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "examples"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/examples/with-script-in-browser"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "examples"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
