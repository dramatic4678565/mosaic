name: Upstream sync

# Daily merge of excalidraw/excalidraw into Mosaic, opening a PR.
#
# Hard rules enforced here (see UPSTREAM_SYNC.md):
#   - never auto-merges into main; a human merges the PR
#   - branded files keep the Mosaic side on conflict, everything else takes
#     upstream
#   - free Actions tier only; uses the built-in GITHUB_TOKEN, no PAT
#
# The script is idempotent and exits 0 without doing anything when main already
# contains upstream/master, so the daily cron costs nothing on a quiet day.

on:
  schedule:
    # 03:00 UTC daily. Off the hour boundary on purpose: GitHub delays the
    # top-of-hour scheduled runs to avoid a thundering herd.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve conflicts and report, then abort without pushing"
        type: boolean
        default: false

permissions:
  contents: write # push the sync branch
  pull-requests: write # open the PR
  issues: write # file an issue when the build is red

# NOTE ON REPOSITORY SETTINGS — CORRECTED 2026-10-05
#
# The block above was assumed to be sufficient, on the belief that the
# repository-level toggle
#   Settings -> Actions -> General -> Workflow permissions ->
#   "Allow GitHub Actions to create and approve pull requests"
# was the only other gate. That was wrong, and it is now disproved by a run rather
# than argued.
#
# With the toggle OFF, `gh pr create` fails with
#   GraphQL: Resource not accessible by integration (createPullRequest)
# With the toggle ON, it fails with exactly the same error. Verified by run
# 37297488380 (2026-10-05T16:34Z), the first run dispatched after the toggle was
# enabled, which again reported `success` while opening nothing.
#
# So `GITHUB_TOKEN` cannot open pull requests on this repository at all, whatever
# the workflow declares. The steps below therefore prefer `secrets.SYNC_PAT` and fall
# back to the built-in token, so the workflow still runs if the secret is removed.
# Today it *needs* the secret: without it the run fails, loudly, at the PR step.
#
# To restore PR creation, add a fine-grained PAT named SYNC_PAT with
# contents:rw, pull-requests:rw, issues:rw, workflows:rw at
#   https://github.com/dramatic4678565/mosaic/settings/secrets/actions

concurrency:
  # One sync at a time. Two overlapping runs would race on the same
  # upstream-sync/<date> branch name.
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/master and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the merge needs upstream's commit graph, and
          # `--allow-unrelated-histories` is not desirable here.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn

      - name: Configure git identity
        run: |
          git config user.name "mosaic-bot"
          git config user.email "mosaic-bot@users.noreply.github.com"

      - name: Restore yarn cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/yarn
            ~/.yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Fetch upstream and leave main
        # The sync script deliberately refuses to run while `main` is checked
        # out — one of its safety properties is that it can never push to main.
        # In CI we arrive on main (that is what we want to sync *from*), so we
        # step onto a scratch branch first. The script then creates its own
        # dated branch explicitly from `main`, so the scratch branch is never
        # used as a base and is left untouched for the runner to discard.
        run: |
          git remote add upstream https://github.com/excalidraw/excalidraw.git
          git fetch upstream master
          git checkout -b upstream-sync-runner

      - name: Report token permissions
        # Diagnostics. `gh pr create` has failed with
        #   GraphQL: Resource not accessible by integration (createPullRequest)
        # which names permissions generically and does not say *which* grant is
        # missing. This step prints the actual effective permissions so the next
        # occurrence is diagnosable from the log instead of by guesswork.
        env:
          # SYNC_PAT first, built-in token second. See the note on repository
          # settings above: with only GITHUB_TOKEN, `gh pr create` still fails
          # `Resource not accessible by integration (createPullRequest)` on this
          # repository even with `pull-requests: write` declared *and*
          # `can_approve_pull_request_reviews` set to true. A PAT is the only
          # mechanism that works today; the built-in token remains the fallback so
          # the workflow still functions if the secret is ever removed.
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "### effective permissions"
          gh api "repos/${{ github.repository }}/actions/permissions/workflow" \
            --jq '.default_workflow_permissions + " / can_approve_pull_request_reviews=" + (.can_approve_pull_request_reviews|tostring)' || true
          echo "### token identity"
          gh api user --jq .login 2>/dev/null \
            || echo "(GITHUB_TOKEN cannot read /user - expected)"
          echo "### token scopes"
          curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/user | grep -i "^x-oauth-scopes" || \
            echo "(no scope header - expected for an installation token)"

      # The script itself does the install/build/test/PR dance, so CI and a
      # developer's laptop follow exactly the same path.
      - name: Run sync
        id: sync
        env:
          # SYNC_PAT first, built-in token second — see the note on repository
          # settings above. This is the step that runs `gh pr create` (inside
          # scripts/sync-upstream.sh), so this is the value that decides whether
          # the sync can open its pull request at all.
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          # The script pushes with plain git; make sure it can authenticate.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry run requested - no branch will be pushed"
            bash scripts/sync-upstream.sh --no-pr
          else
            bash scripts/sync-upstream.sh
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Upstream sync"
            echo ""
            if [ "${{ steps.sync.outcome }}" = "success" ]; then
              echo "Merged upstream/master and opened a PR (or found nothing to sync)."
            else
              echo "Sync did not complete. Nothing was merged into main."
              echo "If the build was red, an issue with the diff was opened."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
