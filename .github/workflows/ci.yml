name: CI

# Mosaic CI. Runs on every PR and on push to main.
#
# Design notes
# ------------
# - Single job, not a matrix. The spec asked for a "matrix: node 20", and one
#   node version is expressed directly rather than through a one-element matrix:
#   a matrix that only ever has one member costs a round of job scheduling and
#   makes the required-version list look extensible when it is not.
# - `test:all` chains the editor suite (~2400 tests) and the dashboard suite.
#   They are kept as separate projects rather than merged into one so a
#   dashboard-only change does not pay for the editor's minutes-long suite.
# - The dashboard's Playwright suite runs here too, so a rebrand regression that
#   re-introduces visible "Excalidraw" text cannot merge.
#
# Everything uses the built-in GITHUB_TOKEN and ubuntu-latest, so this runs on
# the free Actions tier with no configuration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Saves minutes on busy PRs and keeps
# the free tier's concurrent-run limit from being wasted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn

      # Restore the dependency cache directly as well. setup-node's `cache:
      # yarn` only caches the yarn *downloads*, not `node_modules`, so without
      # this the install re-links ~1.5k packages on every run.
      - name: Restore yarn cache
        id: yarn-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cache/yarn
            ~/.yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (eslint --max-warnings=0)
        run: yarn test:code

      - name: Format check (prettier)
        run: yarn test:other

      - name: Typecheck
        run: yarn test:typecheck

      - name: Unit tests (editor + dashboard)
        run: yarn test:all

      - name: Rebrand guard
        # Fails if a bulk edit renamed an internal identifier, a localStorage key,
        # an IndexedDB store or a LICENSE file. Cheap, and it is the single most
        # valuable check in this repo.
        run: yarn verify:brand

      - name: Build editor
        run: yarn build

      - name: Build dashboard
        run: yarn build:dashboard

      # ---------------------------------------------------------------
      # Playwright. Installs only the chromium browser to stay inside the
      # free tier's runner minutes.
      # ---------------------------------------------------------------
      - name: Install Playwright browsers
        run: yarn --cwd mosaic-dashboard exec playwright install --with-deps chromium

      - name: E2E (dashboard, editor, rebrand audit)
        run: yarn e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: playwright-report
          path: mosaic-dashboard/playwright-report
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: builds-${{ github.sha }}
          path: |
            excalidraw-app/build
            mosaic-dashboard/dist
          retention-days: 7
          if-no-files-found: error
