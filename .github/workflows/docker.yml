name: Docker image

# Builds the Mosaic image and publishes it to GHCR on a version tag.
#
# Free Actions tier only: ubuntu-latest, the built-in GITHUB_TOKEN, and no
# registry credentials to configure. GHCR accepts GITHUB_TOKEN directly when
# the repository grants `packages: write`.
#
# The tag filter is `v*`, matching the release tags created by STEP 7.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to the current ref)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Buildx is needed for multi-stage builds and for pushing by digest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The built-in token. No PAT, no stored docker-login secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          # On a `v*` tag push, also move `latest`.
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance/SBOM attestation keeps the free tier's build cache correct
          # and gives the published image a verifiable link back to this commit.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        # Pull it back and assert both routes respond, so a broken publish is
        # caught here rather than by whoever runs it next.
        #
        # The wait loop matters: `docker run -d` returns as soon as the container
        # is *created*, which is before nginx has bound its socket. Probing
        # immediately gives a false "did not serve" on a perfectly good image —
        # which is exactly what happened on the first two runs of this workflow.
        #
        # `127.0.0.1` rather than `localhost`: the runner may resolve localhost
        # to ::1, which this container does not listen on.
        #
        # On failure the container state and logs are dumped, because "could not
        # connect" cannot otherwise distinguish "nginx exited" from "nginx
        # 404s" from "we probed too early".
        run: |
          set -uo pipefail
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker pull "$IMAGE"
          docker rm -f mosaic-smoke >/dev/null 2>&1 || true
          docker run -d --name mosaic-smoke -p 8080:8080 "$IMAGE" >/dev/null

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo "::group::container state"
            docker ps -a --filter name=mosaic-smoke
            echo "::endgroup::"
            echo "::group::container logs"
            docker logs mosaic-smoke 2>&1 || true
            echo "::endgroup::"
            docker rm -f mosaic-smoke >/dev/null 2>&1 || true
            echo "::error::container did not serve on :8080"
            exit 1
          fi

          echo "--- / (dashboard) ---"
          curl -fsS http://127.0.0.1:8080/ | grep -o "<title>[^<]*</title>"
          echo "--- /app/ (editor) ---"
          curl -fsS http://127.0.0.1:8080/app/ | grep -o "<title>[^<]*</title>"
          # A hashed asset must be reachable; a 404 here is the silent failure
          # mode where the shell renders but the app never boots.
          ASSET="$(curl -fsS http://127.0.0.1:8080/app/ | grep -o '/app/assets/index-[^"]*\.js' | head -n1)"
          test -n "$ASSET"
          curl -fsS -o /dev/null -w "asset %{http_code}\n" "http://127.0.0.1:8080$ASSET"

          docker rm -f mosaic-smoke >/dev/null
