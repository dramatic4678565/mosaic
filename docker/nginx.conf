# Mosaic nginx configuration — serves both apps from one origin.
#
# Layout:
#   /            -> mosaic-dashboard/dist  (SPA)
#   /app/        -> excalidraw-app/build   (SPA)
#
# The single most important property here is that both apps share one origin.
# The dashboard embeds the editor in an iframe and both read the same IndexedDB
# (`mosaic-dashboard`); IndexedDB is partitioned per origin, so serving them
# from different hosts would leave the editor reading an empty database.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads and large scenes can be a few MB.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # -----------------------------------------------------------------------
    # Editor: /app/
    # -----------------------------------------------------------------------
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # The editor's service worker must not be cached, or a stale worker pins an
    # old bundle after a deploy. Same for the dashboard's.
    location = /app/sw.js {
        alias /usr/share/nginx/html/app/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # Dashboard: everything else at the root
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets are immutable. The name changes whenever the content does,
    # so a long max-age is safe and is the single biggest win for repeat loads.
    location ~* ^/assets/.*\.[0-9a-f]{8,}\.(js|css|woff2|png|svg|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The editor's assets live one level deeper but are hashed the same way.
    location ~* ^/app/assets/.*\.[0-9a-f]{8,}\.(js|css|woff2|png|svg|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------------------------------------------------------
    # Headers
    # -----------------------------------------------------------------------
    # The iframe embedding the editor is same-origin, so `frame-ancestors` can
    # stay locked to self. This is the same-origin guard the editor also
    # enforces in JS; the header makes it unconditional.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # IndexedDB, service workers and the editor's WebAssembly/worker features
    # need a secure context. `localhost` counts as one, so local Docker works;
    # a non-localhost host must be served over TLS or these APIs are unavailable.
    # Documented in README.md rather than worked around here.
}